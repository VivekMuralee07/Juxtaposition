name: CI
on:
  push:
  pull_request:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the signed APK as a GitHub Release (only on main, only when signing secrets exist)
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore the release keystore (only when the secrets are set)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::notice::No signing secrets set, so this build is debug-signed (for testing only, not published)."
          fi

      - name: Test and build the APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Check the signing key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          want=$(tr -d ' \n' < android/release-cert.sha256)
          cert() { "$APKSIGNER" verify --print-certs "$1" | grep 'certificate SHA-256' | head -1 | awk '{print $NF}'; }
          if [ -f dist/NearbyEats.apk ]; then
            got=$(cert dist/NearbyEats.apk)
            if [ "$got" != "$want" ]; then
              echo "::error::dist/NearbyEats.apk is not signed with the release key (got $got). An APK signed with a different key cannot update installed copies of the app."
              exit 1
            fi
          fi
          if [ "$SIGNED" = "true" ]; then
            built=$(cert android/app/build/outputs/apk/release/app-release.apk)
            if [ "$built" != "$want" ]; then
              echo "::error::The CI-built APK is not signed with the pinned release key. Check the KEYSTORE_* secrets."
              exit 1
            fi
          fi

      - name: Upload the signed APK
        if: env.SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NearbyEats-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish a GitHub Release (main only, new version only)
        if: env.SIGNED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists, skipping."
          else
            cp android/app/build/outputs/apk/release/app-release.apk NearbyEats.apk
            gh release create "v$VERSION" NearbyEats.apk --title "Nearby Eats $VERSION" --notes "Signed release build of commit ${GITHUB_SHA::7}." --target "$GITHUB_SHA"
          fi
